[package]
name = "focus-timer"
version = "0.1.0"
edition = "2021"
description = "低功耗桌面组件示例：专注计时器（egui）"

[dependencies]
# 精简 feature：去掉 wgpu（换 OpenGL 后端）、accesskit、wayland/x11、links 等
# system_fonts 必须保留，否则中文会显示成方块
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "winit/default",
] }

# 体积与功耗优先的发布配置：静态小体积 + 无 panic 展开
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
