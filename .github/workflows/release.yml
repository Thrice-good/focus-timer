name: release

# 打 tag 时自动构建并发 Release，例如：git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release

      - name: 整理产物
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/focus-timer.exe "dist/focus-timer-${{ github.ref_name }}-windows-x64.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
